version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: radius-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius_admin
      POSTGRES_USER: radius_admin_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - radius-admin-network

  # Radius Admin Application
  app:
    build: .
    container_name: radius-admin-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://radius_admin_user:${DB_PASSWORD:-secure_password_123}@postgres:5432/radius_admin
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-key-here}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - radius-admin-network
    volumes:
      - ./uploads:/app/uploads

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: radius-admin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - radius-admin-network

volumes:
  postgres_data:

networks:
  radius-admin-network:
    driver: bridge
